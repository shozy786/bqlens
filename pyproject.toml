[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bqlens"
version = "0.1.0"
description = "Find where your BigQuery bytes go and what to do about it"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Shehroz Ahmed", email = "shozy.khantastic@gmail.com" }]
dependencies = ["sqlglot>=21.0", "click>=8.1", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bqlens = "bqlens.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
